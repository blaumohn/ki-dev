# Template for one sibling checkout, applied with:
#   scripts/agent-container --mount NAME ...
# Copy to ${XDG_CONFIG_HOME:-~/.config}/ki-dev/agent-container/mounts/NAME.yaml
# and replace NAME and the source path. Use an absolute source: Compose
# resolves relative paths against the ki-dev checkout, which differs per
# worktree.
#
# Optional repo contract, checked before Docker starts (exit 2 if invalid):
# repo is the container path of a bind target below; per package manager
# (npm, composer) the input files and the install directory, both relative
# to repo. Names and paths are reported per field, e.g.
# NAME.yaml: x-ki-dev.deps.0.manager: unbekannter Wert.
# x-ki-dev:
#   repo: /NAME
#   deps:
#     - {manager: npm, inputs: [package.json, package-lock.json], install: node_modules}
#     - {manager: composer, inputs: [composer.json, composer.lock], install: vendor}
services:
  agent:
    volumes:
      - type: bind
        source: /absolute/path/to/NAME
        target: /NAME
        bind:
          create_host_path: false
    # Optional: keep generated directories out of the host checkout.
    # tmpfs:
    #   - /NAME/var:rw,nosuid,nodev,mode=1777
