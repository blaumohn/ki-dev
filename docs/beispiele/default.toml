# Profil des README-Beispiels (Schritt 2, Rollen besetzen); README.md und
# README.en.md zeigen es kommentiert, tests/test_readme_profile.py hält
# die Werte gleich. readme-scripts/4-auftrag.sh legt es im
# Arbeits-Worktree calc-work ab: Pfade gelten ab dort, wo ki-dev startet.
workdir = "."
access_profile = "write"

[worker]
executor = "codex"
session_id = "019a…"
model = "gpt-5.6-terra"
effort = "high"

[review]
executor = "claude"
session_id = "b3f1…"
model = "sonnet"
effort = "high"

[[tests]]
name = "test_add"
argv = ["python3", "test_add.py"]

[limits]
changes_rounds = 3

[finalization]
target_workdir = "../calc"
target_ref = "refs/heads/main"
commit_message = "Fix add()"
data_mode = "file_proposal"
