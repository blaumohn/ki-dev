# Übergangsbestand bis ki-dev-ablauf-cak.7: dieselbe Datei liegt im
# Ablaufpaket außerhalb des Gerüsts (docs/ablaufpakete.de.md).
# Auflösung: Karte → dünne Vorgänge.
# Paketablauf auf dem Review-Muster: Zustände und Kanten aus dem
# Muster, gemeinsame Teile aus dem Katalog flow/patterns/review.toml;
# hier stehen nur Parameter. PASS führt nach finished, der Hinweis
# nennt den nächsten Schritt. `ki-dev -f NAME step` führt einen Turn mit dem
# Executor manual aus.

name = "graph"
templates = "review"
pattern_catalog = ["ki_dev:review"]
start = "graph"

[[phase]]
id = "graph"
use = "write_review"
next = "finished"

[phase.template]
write = "role-graph"
review = "review-graph"
again = "again-graph"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "source_refs" },
  { use = "next_steps" }, { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "source_refs" },
  { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]

# Bead-Felder, ohne die eine Übergabe formal unvollständig ist (Exit 2).
[phase.require]
write = ["source_refs"]
review = ["source_refs"]

# Rollen der Sitzungen; welcher Executor (Agent, manual, mock) eine
# Rolle bearbeitet, sagt das Profil.
[phase.role]
write = "worker"
review = "review"
correction = "worker"

[phase.actor]
write = "Auflösungsagent"
review = "Review-Agent (Graphprüfung)"
correction = "Auflösungsagent (bisherige Sitzung)"

[phase.hint.write]
done = "je dünnem Vorgang `ki-dev -f graph step VORGANG graph.review`"

[phase.hint.review]
PASS = "`ki-dev -f materialize step {bead} materialize`"
fix = "Befunde an den Auflösungsagenten (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev -f graph step {bead} graph.correction graph.correction=ANTWORT.json`"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev -f materialize step {bead} materialize`"
correct = "Entscheidung an den Auflösungsagenten (bisherige Sitzung)"
