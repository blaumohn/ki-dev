# Übergangsbestand bis ki-dev-ablauf-cak.7: dieselbe Datei liegt im
# Ablaufpaket außerhalb des Gerüsts (docs/ablaufpakete.de.md).
# Umsetzungsablauf (`ki-dev -f implement BEAD`): ein begrenzter Auftrag
# von der ersten Beauftragung bis zur geprüften Integration.
#
# Hauptdeklaration des Ablaufpakets: `ops` nennt das Modul, das die
# Operationen dieses Ablaufs umsetzt (Start, Fortsetzung, Status);
# Rollen und Adapter wählt das Profil (`--profile`), nicht diese Datei.
#
# Die frühere „loop“ ist hier keine eigene Ebene, sondern eine
# Rückkante: controller_step --fix--> worker_step_prepare
# → … → checkpoint --> controller_step. Wann sie endet, entscheiden
# allein die Wächter dieses Ablaufs (Runden- und Versuchsgrenzen), nicht
# der Ausführer.
#
# Zwei Teile:
# - Fachschicht (`[state.<id>]`, Befundklassen): was ein Zustand für
#   den Ausführer ist (`kind`, `actor`) und was er beim Betreten tut
#   (`operation`, Moore-Ausgabe). Format: src/ki_dev/flow/model.py.
# - FSM-Kern (`[statechart]`): Zustände und Kanten im nativen Format von
#   python-statemachine; Kantenwahl, History und `raise` übernimmt die
#   Bibliothek (src/ki_dev/fsm.py). Wächter und Aktionen sind Namen der
#   Ops-Klasse `ImplementModel` (src/ki_dev/flow_ops/implement/machine/model.py).
#
# Lesart einer Kante (UML-Schreibweise):
#   source --event [cond] / on--> target
# Kanten eines Zustands werden in Dateireihenfolge geprüft, dann die
# seines Elternzustands; die erste, deren `cond` gelten und deren
# `unless` nicht gelten, gewinnt. Passt keine, ist das Ereignis dort
# nicht erlaubt. Eine Kante ohne Ziel mit `raise escalation.<ursache>`
# lässt den Ablauf im Quellzustand; anhalten ist Sache des Laufs
# (runner/run.toml), nach der Antwort geht es dort weiter.

name = "implement"
ops = "ki_dev.flow_ops.implement.commands"
# Review-Antworten des Controllers: PASS oder eine Befundklasse; das
# Urteil folgt aus der Klasse (ein Vokabular für step und run).
priority = ["escalate", "decision", "fix"]

[finding_class.fix]
verdict = "CHANGES"
text = "an ein Abnahmekriterium gebunden, korrigierbar"

[finding_class.decision]
verdict = "NEEDS_DECISION"
text = "nur der Mensch kann entscheiden"

[finding_class.escalate]
verdict = "ESCALATE"
text = "nicht zuverlässig automatisch fortsetzbar"

[vocabulary]
# machine: ki-dev erzeugt das Ereignis selbst; agent: ein Adapter
# liefert die formale Antwort; finalization: Git-Abschlussweg,
# wiederholbar; wait: Halt bis zu einer Antwort von außen.
kinds = ["machine", "agent", "finalization", "wait", "final"]

# --- Fachschicht je Zustand -------------------------------------------
#
# Was der Ausführer beim Betreten tut. start, task, prepare und
# checkpoint erzeugt ki-dev selbst; work und review rufen einen
# Adapter; evidence und die Abschlussoperationen sind Git-/bd-Arbeit.
# `failure`: Ereignis, wenn die Wirkung technisch scheitert;
# `repeatable`: darf nach Prozessende erneut laufen (sonst ist eine
# begonnene Wirkung ohne Ergebnis unklar).

[state.start]
kind = "machine"
operation = [{ do = "start" }]

[state.controller_step]
kind = "agent"
actor = "Controller (Review-Sitzung)"
# Ohne geprüftes Ergebnis gibt es nichts zu beurteilen: der erste
# Auftrag kommt aus der Laufkonfiguration, nicht von einem Agenten.
[[state.controller_step.operation]]
do = "review"
cond = ["checked_result"]
template = "review"
failure = "process_error"
[[state.controller_step.operation]]
do = "task"

[state.worker_step_prepare]
kind = "machine"
operation = [{ do = "prepare", failure = "process_error" }]

[state.worker_step]
kind = "agent"
actor = "Worker (Bau-Sitzung)"
operation = [
  { do = "work", template = "work", failure = "worker_process_error" },
]

[state.capture_step_result]
kind = "machine"
operation = [{ do = "evidence", failure = "process_error" }]

[state.checkpoint]
kind = "machine"
operation = [{ do = "checkpoint" }]

[state.freeze_reviewed_result]
kind = "finalization"
[[state.freeze_reviewed_result.operation]]
do = "freeze"
repeatable = true
failure = "finalization_error"

[state.finalize_history]
kind = "finalization"
[[state.finalize_history.operation]]
do = "finalize_history"
repeatable = true
failure = "finalization_error"

[state.verify_final_result]
kind = "finalization"
[[state.verify_final_result.operation]]
do = "verify_final"
repeatable = true
failure = "finalization_error"

[state.fast_forward_integrate]
kind = "finalization"
[[state.fast_forward_integrate.operation]]
do = "integrate"
repeatable = true
failure = "finalization_error"

[state.waiting_decision]
kind = "wait"
actor = "Mensch (Entscheider)"

[state.passed]
kind = "final"

[state.error]
kind = "final"

# --- FSM-Kern ---------------------------------------------------------

[statechart]
name = "implement"

# Alle Arbeitszustände liegen in `active`.
[statechart.states.active]
initial = true

# Schutzhalt (Kontext-/Kontingentgrenze, fehlgeschlagener
# Agentenaufruf): aus jedem aktiven Zustand anhalten, Fortsetzung dort.
[[statechart.states.active.transitions]]
event = "execution_stopped"
on = [{ raise = { event = "escalation.execution_guard" } }]

# Empfänger der Eskalation (`raise`): die Ursache landet im Modell.
[[statechart.states.active.transitions]]
event = "escalation"
on = "record_escalation"

[statechart.states.active.states.start]
initial = true

[[statechart.states.active.states.start.transitions]]
event = "run_started"
target = "controller_step"
on = "drop_result"

# --- Beauftragung -----------------------------------------------------

[[statechart.states.active.states.controller_step.transitions]]
event = "controller_task"
unless = "worker_attempts_left"
on = [{ raise = { event = "escalation.worker_attempts_exhausted" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "controller_task"
target = "worker_step_prepare"
on = ["begin_task", "drop_result"]

# --- Rückkante: CHANGES öffnet eine Korrekturrunde --------------------

# Fakten des Ausführers (Korrekturbudget, Stagnation) vor den
# Rundengrenzen des Ablaufs.
[[statechart.states.active.states.controller_step.transitions]]
event = "fix"
cond = ["checked_result", "changes_refused"]
on = [{ raise = { event = "escalation.execution_guard" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "fix"
cond = ["checked_result", "stagnation"]
on = [{ raise = { event = "escalation.execution_guard" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "fix"
cond = "checked_result"
unless = "changes_rounds_left"
on = [{ raise = { event = "escalation.changes_rounds_exhausted" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "fix"
cond = "checked_result"
unless = "worker_attempts_left"
on = [{ raise = { event = "escalation.worker_attempts_exhausted" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "fix"
cond = "checked_result"
target = "worker_step_prepare"
on = ["begin_correction", "drop_result"]

# --- weitere Controller-Urteile ---------------------------------------

[[statechart.states.active.states.controller_step.transitions]]
event = "decision"
target = "waiting_decision"

[[statechart.states.active.states.controller_step.transitions]]
event = "escalate"
on = [{ raise = { event = "escalation.agent" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "PASS"
cond = "checked_result"
target = "freeze_reviewed_result"

[[statechart.states.active.states.controller_step.transitions]]
event = "protocol_error"
unless = "protocol_attempts_left"
on = [{ raise = { event = "escalation.protocol_attempts_exhausted" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "protocol_error"
target = "controller_step"
on = "retry_protocol"

# Technischer Fehler der Maschinenoperation: begrenzt am selben Ort
# wiederholen, dann anhalten.
[[statechart.states.active.states.controller_step.transitions]]
event = "process_error"
unless = "process_retries_left"
on = [{ raise = { event = "escalation.process_retries_exhausted" } }]

[[statechart.states.active.states.controller_step.transitions]]
event = "process_error"
target = "controller_step"
on = "retry_process"

# --- Worker-Turn ------------------------------------------------------

[[statechart.states.active.states.worker_step_prepare.transitions]]
event = "worker_inputs_prepared"
target = "worker_step"

# Technischer Fehler der Maschinenoperation: begrenzt am selben Ort
# wiederholen, dann anhalten.
[[statechart.states.active.states.worker_step_prepare.transitions]]
event = "process_error"
unless = "process_retries_left"
on = [{ raise = { event = "escalation.process_retries_exhausted" } }]

[[statechart.states.active.states.worker_step_prepare.transitions]]
event = "process_error"
target = "worker_step_prepare"
on = "retry_process"

[[statechart.states.active.states.worker_step.transitions]]
event = "worker_completed"
target = "capture_step_result"

[[statechart.states.active.states.worker_step.transitions]]
event = "worker_needs_decision"
target = "waiting_decision"

[[statechart.states.active.states.worker_step.transitions]]
event = "worker_escalate"
on = [{ raise = { event = "escalation.agent" } }]

[[statechart.states.active.states.worker_step.transitions]]
event = "worker_process_error"
unless = "process_retries_left"
on = [{ raise = { event = "escalation.process_retries_exhausted" } }]

[[statechart.states.active.states.worker_step.transitions]]
event = "worker_process_error"
target = "worker_step_prepare"
on = "retry_process"

[[statechart.states.active.states.worker_step.transitions]]
event = "protocol_error"
unless = "protocol_attempts_left"
on = [{ raise = { event = "escalation.protocol_attempts_exhausted" } }]

[[statechart.states.active.states.worker_step.transitions]]
event = "protocol_error"
target = "worker_step"
on = "retry_protocol"

# --- Nachweis: nur wirksamer Delta wird geprüft -----------------------

[[statechart.states.active.states.capture_step_result.transitions]]
event = "step_result_captured"
cond = "delta_effective"
target = "checkpoint"

[[statechart.states.active.states.capture_step_result.transitions]]
event = "step_result_captured"
unless = "changes_rounds_left"
on = [{ raise = { event = "escalation.empty_result_unresolved" } }]

[[statechart.states.active.states.capture_step_result.transitions]]
event = "step_result_captured"
unless = "worker_attempts_left"
on = [{ raise = { event = "escalation.worker_attempts_exhausted" } }]

[[statechart.states.active.states.capture_step_result.transitions]]
event = "step_result_captured"
target = "worker_step_prepare"
on = ["begin_correction", "drop_result"]

# Technischer Fehler der Maschinenoperation: begrenzt am selben Ort
# wiederholen, dann anhalten.
[[statechart.states.active.states.capture_step_result.transitions]]
event = "process_error"
unless = "process_retries_left"
on = [{ raise = { event = "escalation.process_retries_exhausted" } }]

[[statechart.states.active.states.capture_step_result.transitions]]
event = "process_error"
target = "capture_step_result"
on = "retry_process"

[[statechart.states.active.states.checkpoint.transitions]]
event = "checkpoint_recorded"
target = "controller_step"
on = "keep_result"

# --- Abschluss: PASS ist ein Urteil, PASSED erst nach Integration -----

[[statechart.states.active.states.freeze_reviewed_result.transitions]]
event = "reviewed_result_frozen"
target = "finalize_history"

[[statechart.states.active.states.freeze_reviewed_result.transitions]]
event = "finalization_error"
target = "error"

[[statechart.states.active.states.finalize_history.transitions]]
event = "history_finalized"
target = "verify_final_result"

[[statechart.states.active.states.finalize_history.transitions]]
event = "finalization_error"
target = "error"

[[statechart.states.active.states.verify_final_result.transitions]]
event = "final_result_verified"
cond = "result_ok"
target = "fast_forward_integrate"

[[statechart.states.active.states.verify_final_result.transitions]]
event = "final_result_verified"
on = [{ raise = { event = "escalation.final_verification_failed" } }]

[[statechart.states.active.states.verify_final_result.transitions]]
event = "finalization_error"
target = "error"

[[statechart.states.active.states.fast_forward_integrate.transitions]]
event = "integration_completed"
cond = "result_ok"
target = "passed"

[[statechart.states.active.states.fast_forward_integrate.transitions]]
event = "integration_completed"
on = [{ raise = { event = "escalation.integration_failed" } }]

[[statechart.states.active.states.fast_forward_integrate.transitions]]
event = "finalization_error"
target = "error"

# --- Entscheidung des Menschen ---------------------------------------

# Beim Betreten hält der Lauf an (`wait`, Region halt in run.toml).
[statechart.states.waiting_decision]
enter = [{ raise = { event = "wait" } }]
transitions = [
  { event = "resume_requested", target = "controller_step" },
]

[statechart.states.passed]
final = true

[statechart.states.error]
final = true

[op.work]
role = "worker"
do = "agent.work"
input = ["task", "round_id", "open_objection", "operation_id"]
output = { work_report = ["summary"] }
success = "worker_completed"

[op.evidence]
do = "evidence.collect"
input = ["task", "round_id", "work_report", "round_base", "run_base"]
output = { evidence = ["projection"], reviewed_refs = ["reviewed_refs"] }
payload = { assessment = ["assessment"] }
success = "step_result_captured"

[op.review]
role = "review"
do = "review.decide"
input = ["task", "round_id", "evidence", "work_report", "decision_answer", "attempt_id"]
output = { decision = ["decision"] }
events = ["PASS", "fix", "decision", "escalate"]

[op.freeze]
do = "git.freeze"
input = ["task", "run_base", "reviewed_refs"]
output = "frozen_result"
success = "reviewed_result_frozen"

[op.finalize_history]
do = "git.finalize_history"
input = ["frozen_result"]
output = "final_result"
success = "history_finalized"

[op.verify_final]
do = "git.verify"
input = ["frozen_result", "final_result"]
output = {}
payload = { ok = ["ok"] }
success = "final_result_verified"

[op.integrate]
do = "git.integrate"
input = ["frozen_result", "final_result"]
output = {}
payload = { ok = ["ok"] }
success = "integration_completed"
