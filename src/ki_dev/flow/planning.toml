# Planungsablauf: von der Quelle bis zum umgesetzten Ergebnis.
#
# Jede Phase (map, graph, materialize, implement) hat eigene Zustände:
#   P             Schreibsitzung (erstellt oder ergänzt das Ergebnis)
#   P.review      getrennte Review-Sitzung
#   P.correction  Schreibagent behebt Befunde der Klasse fix
#   P.decision    der Mensch entscheidet
# Gemeinsam: source (offene Frage braucht eine neue Quelle) und finished.
#
# Die Korrekturschleife ist hier nur eine Rückkante
# (P.review --fix--> P.correction --done--> P.review), keine eigene
# Ebene. Ein Review endet mit PASS oder mit der stärksten Befundklasse
# nach `priority`; das Urteil (CHANGES/NEEDS_DECISION) folgt aus der
# Klasse. `hint` ist die Übergabe an den Menschen als Boten
# (Adapter manual, `ki-dev step`); {bead} setzt ki-dev ein.
# Die vier Phasen teilen gemeinsame Muster (`pattern_catalog`,
# flow/patterns/review.toml, Expansion: flow/pattern.py); jede
# Phase liefert nur ihre Parameter: nächste Phase, Akteure, Hinweise.
# Format und Prüfung: src/ki_dev/flow/model.py.

name = "planning"
pattern_catalog = ["review"]
start = "map"
final = ["finished"]
priority = ["decision", "source", "fix"]

[vocabulary]
kinds = [
  "write", "review", "correction", "decision", "source", "machine", "final",
]
events = [
  "PASS", "done", "fix", "source", "decision",
  "accept", "correct", "imported",
  "checks_passed", "checks_partial", "checks_failed",
]
# full_checks: der letzte Vorlauf lief vollständig (kein Teillauf);
# ohne ihn gibt es kein PASS. unchanged: Arbeitsbaum und Bead sind
# seit dem Vorlauf unverändert (synchron verglichen, wie freeze bei run).
guards = ["full_checks", "unchanged"]
# Was der Ausführer beim Betreten tut: turn = Übergabe an eine Sitzung
# (Adapter manual: Ausgabe für den Menschen als Boten), ask = der Mensch
# entscheidet, checks = deterministischer Vorlauf (läuft automatisch).
# Vorlage und Kontext einer Übergabe stehen an der Operation des
# Zustands oder, wenn die Kante sie bestimmt (Nachricht am Übergang),
# an der Kante; gilt die letzte Kante des Weges mit Vorlage, sonst die
# Operation des Haltezustands.
operations = ["turn", "ask", "checks"]
# Kontextbausteine einer Übergabe (turn), in der deklarierten
# Reihenfolge nach der Rollenvorlage: finding_classes = Befundklassen
# für Review-Rollen, epic_sections = Hinweise der Eltern-Epics,
# source_refs = Quellenreferenzen (unaufgelöst), criteria = Referenzen
# der Abnahmekriterien, next_steps = Folgeschritte laut Kanten dieses
# Ablaufs, reading_hint = Lesehinweis des Sitzungsimports, report =
# Vorlaufbericht (report_followup: mit Leerzeile davor), guidelines =
# Leitlinien (docs/policies, je Phase), feedback_review/feedback_repair
# = Rückmeldung des Schreibagenten, human_note = Hinweis an den
# Menschen, finding = Befund des Vorlaufs, control = vorgeschlagene
# Prüfsteuerung. Was ein Baustein liefert, steckt der Aufrufer ein
# (ki-dev step: ki_dev.ops.context.blocks). Die Kopfzeilen und gemeinsamen
# Regeln stehen in der Vorlage.
context = [
  "finding_classes", "epic_sections", "source_refs", "criteria",
  "next_steps", "attempt", "reading_hint", "report", "report_followup",
  "guidelines", "feedback_review", "feedback_repair", "human_note",
  "finding", "control",
]

# Pflichtereignisse je Zustandsart: jeder Zustand dieser Art muss sie
# behandeln, sonst bleibt ein Ausgang einer Sitzung ohne Folge.
[required]
write = ["done"]
review = ["PASS", "fix", "source", "decision"]
correction = ["done"]
decision = ["accept", "correct", "source"]
source = ["imported"]
machine = ["checks_passed", "checks_partial", "checks_failed"]

# Bindung der Maschinenoperation an den Ops-Katalog: `checks` ruft
# den Vorlauf `checks.preflight` (ki_dev.ops.checks); sein Ergebnis ist
# eines der genannten Ereignisse. turn und ask sind Halte des
# Ausführers, keine Katalogoperationen.
[op.checks]
do = "checks.preflight"
input = []
output = {}
events = ["checks_passed", "checks_partial", "checks_failed"]

[finding_class.fix]
verdict = "CHANGES"
text = "aus vorhandenen Quellen korrigierbar"

[finding_class.source]
verdict = "NEEDS_DECISION"
text = "offene Frage, braucht eine neue Quelle"

[finding_class.decision]
verdict = "NEEDS_DECISION"
text = "nur der Mensch kann entscheiden"

# --- Muster: flow/patterns/review.toml (review_core, write_review,
# write_review_preflight) ------------------------------------------

# --- Phasen -----------------------------------------------------------

[[phase]]
id = "map"
use = "write_review"
next = "graph"

[phase.template]
write = "role-map"
review = "review-map"
again = "again-map"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "source_refs" },
  { use = "next_steps" }, { use = "reading_hint" },
  { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "source_refs" },
  { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]

[phase.actor]
write = "Kartierungsagent"
review = "Review-Agent (Kartenprüfung)"
correction = "Kartierungsagent (bisherige Sitzung)"

[phase.hint.write]
done = "`ki-dev step KARTE --step review --review-of map` (KARTE = erstellte oder ergänzte Karte)"

[phase.hint.review]
PASS = "`ki-dev step {bead} --step graph`"
fix = "Befunde an den Kartierungsagenten (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev step {bead} --step review --review-of map --next-turn`"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step graph`"
correct = "Entscheidung an den Kartierungsagenten (bisherige Sitzung)"

[[phase]]
id = "graph"
use = "write_review"
next = "materialize"

[phase.template]
write = "role-graph"
review = "review-graph"
again = "again-graph"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "source_refs" },
  { use = "next_steps" }, { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "source_refs" },
  { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]

[phase.actor]
write = "Auflösungsagent"
review = "Review-Agent (Graphprüfung)"
correction = "Auflösungsagent (bisherige Sitzung)"

[phase.hint.write]
done = "je dünnem Vorgang `ki-dev step VORGANG --step review --review-of graph`"

[phase.hint.review]
PASS = "`ki-dev step {bead} --step materialize`"
fix = "Befunde an den Auflösungsagenten (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev step {bead} --step review --review-of graph --next-turn`"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step materialize`"
correct = "Entscheidung an den Auflösungsagenten (bisherige Sitzung)"

[[phase]]
id = "materialize"
use = "write_review"
next = "implement"

[phase.template]
write = "role-materialize"
review = "review-materialize"
again = "again-materialize"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "source_refs" },
  { use = "next_steps" }, { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "source_refs" },
  { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]

[phase.actor]
write = "Materialisierungsagent"
review = "Review-Agent (Materialisierungsprüfung)"
correction = "Materialisierungsagent (bisherige Sitzung)"

[phase.hint.write]
done = "`ki-dev step {bead} --step review --review-of materialize`"

[phase.hint.review]
PASS = "`ki-dev step {bead} --step implement`"
fix = "Befunde an den Materialisierungsagenten (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev step {bead} --step review --review-of materialize --next-turn`"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step implement`"
correct = "Entscheidung an den Materialisierungsagenten (bisherige Sitzung)"

[[phase]]
id = "implement"
use = "write_review_preflight"
next = "finished"

[phase.template]
write = "role-implement"
review = "review-implement"
again = "again-implement"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "criteria" },
  { use = "next_steps" },
  { use = "report" },
  { use = "guidelines" }, { use = "attempt" },
]

[phase.actor]
write = "Umsetzer (implementer)"
review = "Review-Agent (nach deterministischem Vorlauf)"
correction = "Umsetzer (implementer, bisherige Sitzung)"

[phase.hint.write]
done = "`ki-dev step {bead} --step review` (mit Vorlauf)"

[phase.hint.review]
PASS = "Schließen entscheidest du (`bd close {bead}`)"
fix = "Befunde an den Umsetzer (implementer) (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev step {bead} --step review --next-turn` (Vorlauf, optional `--feedback-file DATEI|-`)"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS); Schließen entscheidest du"
correct = "Entscheidung an den Umsetzer (implementer) (bisherige Sitzung)"

# --- gemeinsame Zustände ----------------------------------------------

[[state]]
id = "source"
kind = "source"
actor = "Mensch (Planungssitzung)"
operation = [
  { do = "ask", template = "decision-other", context = [
    { use = "next_steps" }, { use = "control" }, { use = "attempt" },
  ] },
]

[[state]]
id = "finished"
kind = "final"
actor = "Mensch"

# --- neue Quelle: immer über die bestehende Karte ---------------------

[[transition]]
source = "source"
event = "imported"
target = "map"
hint = "`ki-dev step map --agent AGENT --session SITZUNG --title TITEL`; bestehende Karte ergänzen, keine zweite"
