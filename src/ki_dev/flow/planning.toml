# Planungsablauf: von der Quelle bis zum umgesetzten Ergebnis.
#
# Jede Phase (map, graph, materialize, implement) hat eigene Zustände:
#   P             Schreibsitzung (erstellt oder ergänzt das Ergebnis)
#   P.review      getrennte Review-Sitzung
#   P.correction  Schreibagent behebt Befunde der Klasse fix
#   P.decision    der Mensch entscheidet
# Gemeinsam: source (offene Frage braucht eine neue Quelle) und finished.
#
# Die Korrekturschleife ist hier nur eine Rückkante
# (P.review --fix--> P.correction --done--> P.review), keine eigene
# Ebene. Ein Review endet mit PASS oder mit der stärksten Befundklasse
# nach `priority`; das Urteil (CHANGES/NEEDS_DECISION) folgt aus der
# Klasse. `hint` ist die Übergabe an den Menschen als Boten
# (Adapter manual, `ki-dev step`); {bead} setzt ki-dev ein.
# Format und Prüfung: src/ki_dev/flow/model.py.

name = "planning"
start = "map"
final = ["finished"]
priority = ["decision", "source", "fix"]

[vocabulary]
kinds = ["write", "review", "correction", "decision", "source", "final"]
events = [
  "PASS", "done", "fix", "source", "decision",
  "accept", "correct", "imported", "preflight_failed",
]

# Pflichtereignisse je Zustandsart: jeder Zustand dieser Art muss sie
# behandeln, sonst bleibt ein Ausgang einer Sitzung ohne Folge.
[required]
write = ["done"]
review = ["PASS", "fix", "source", "decision"]
correction = ["done"]
decision = ["accept", "correct", "source"]
source = ["imported"]

[finding_class.fix]
verdict = "CHANGES"
text = "aus vorhandenen Quellen korrigierbar"

[finding_class.source]
verdict = "NEEDS_DECISION"
text = "offene Frage, braucht eine neue Quelle"

[finding_class.decision]
verdict = "NEEDS_DECISION"
text = "nur der Mensch kann entscheiden"

# --- Zustände ---------------------------------------------------------

[[state]]
id = "map"
kind = "write"
actor = "Kartierungsagent"

[[state]]
id = "map.review"
kind = "review"
actor = "Review-Agent (Kartenprüfung)"

[[state]]
id = "map.correction"
kind = "correction"
actor = "Kartierungsagent (bisherige Sitzung)"

[[state]]
id = "map.decision"
kind = "decision"
actor = "Mensch"

[[state]]
id = "graph"
kind = "write"
actor = "Auflösungsagent"

[[state]]
id = "graph.review"
kind = "review"
actor = "Review-Agent (Graphprüfung)"

[[state]]
id = "graph.correction"
kind = "correction"
actor = "Auflösungsagent (bisherige Sitzung)"

[[state]]
id = "graph.decision"
kind = "decision"
actor = "Mensch"

[[state]]
id = "materialize"
kind = "write"
actor = "Materialisierungsagent"

[[state]]
id = "materialize.review"
kind = "review"
actor = "Review-Agent (Materialisierungsprüfung)"

[[state]]
id = "materialize.correction"
kind = "correction"
actor = "Materialisierungsagent (bisherige Sitzung)"

[[state]]
id = "materialize.decision"
kind = "decision"
actor = "Mensch"

[[state]]
id = "implement"
kind = "write"
actor = "Umsetzer (implementer)"

[[state]]
id = "implement.review"
kind = "review"
actor = "Review-Agent (nach deterministischem Vorlauf)"

[[state]]
id = "implement.correction"
kind = "correction"
actor = "Umsetzer (implementer, bisherige Sitzung)"

[[state]]
id = "implement.decision"
kind = "decision"
actor = "Mensch"

[[state]]
id = "source"
kind = "source"
actor = "Mensch (Planungssitzung)"

[[state]]
id = "finished"
kind = "final"
actor = "Mensch"

# --- map --------------------------------------------------------------

[[transition]]
source = "map"
event = "done"
target = "map.review"
hint = "`ki-dev step KARTE --step review --review-of map` (KARTE = erstellte oder ergänzte Karte)"

[[transition]]
source = "map.review"
event = "PASS"
target = "graph"
hint = "`ki-dev step {bead} --step graph`"

[[transition]]
source = "map.review"
event = "fix"
target = "map.correction"
hint = "Befunde an den Kartierungsagenten (bisherige Sitzung)"

[[transition]]
source = "map.review"
event = "source"
target = "source"
hint = "offene Fragen in einer Planungssitzung klären"

[[transition]]
source = "map.review"
event = "decision"
target = "map.decision"
hint = "du entscheidest: accept, correct oder source"

[[transition]]
source = "map.correction"
event = "done"
target = "map.review"
hint = "`ki-dev step {bead} --step review --review-of map --next-turn`"

[[transition]]
source = "map.decision"
event = "accept"
target = "graph"
hint = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step graph`"

[[transition]]
source = "map.decision"
event = "correct"
target = "map.correction"
hint = "Entscheidung an den Kartierungsagenten (bisherige Sitzung)"

[[transition]]
source = "map.decision"
event = "source"
target = "source"
hint = "Entscheidung in einer Planungssitzung festhalten"

# --- graph ------------------------------------------------------------

[[transition]]
source = "graph"
event = "done"
target = "graph.review"
hint = "je dünnem Vorgang `ki-dev step VORGANG --step review --review-of graph`"

[[transition]]
source = "graph.review"
event = "PASS"
target = "materialize"
hint = "`ki-dev step {bead} --step materialize`"

[[transition]]
source = "graph.review"
event = "fix"
target = "graph.correction"
hint = "Befunde an den Auflösungsagenten (bisherige Sitzung)"

[[transition]]
source = "graph.review"
event = "source"
target = "source"
hint = "offene Fragen in einer Planungssitzung klären"

[[transition]]
source = "graph.review"
event = "decision"
target = "graph.decision"
hint = "du entscheidest: accept, correct oder source"

[[transition]]
source = "graph.correction"
event = "done"
target = "graph.review"
hint = "`ki-dev step {bead} --step review --review-of graph --next-turn`"

[[transition]]
source = "graph.decision"
event = "accept"
target = "materialize"
hint = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step materialize`"

[[transition]]
source = "graph.decision"
event = "correct"
target = "graph.correction"
hint = "Entscheidung an den Auflösungsagenten (bisherige Sitzung)"

[[transition]]
source = "graph.decision"
event = "source"
target = "source"
hint = "Entscheidung in einer Planungssitzung festhalten"

# --- materialize ------------------------------------------------------

[[transition]]
source = "materialize"
event = "done"
target = "materialize.review"
hint = "`ki-dev step {bead} --step review --review-of materialize`"

[[transition]]
source = "materialize.review"
event = "PASS"
target = "implement"
hint = "`ki-dev step {bead} --step implement`"

[[transition]]
source = "materialize.review"
event = "fix"
target = "materialize.correction"
hint = "Befunde an den Materialisierungsagenten (bisherige Sitzung)"

[[transition]]
source = "materialize.review"
event = "source"
target = "source"
hint = "offene Fragen in einer Planungssitzung klären"

[[transition]]
source = "materialize.review"
event = "decision"
target = "materialize.decision"
hint = "du entscheidest: accept, correct oder source"

[[transition]]
source = "materialize.correction"
event = "done"
target = "materialize.review"
hint = "`ki-dev step {bead} --step review --review-of materialize --next-turn`"

[[transition]]
source = "materialize.decision"
event = "accept"
target = "implement"
hint = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step implement`"

[[transition]]
source = "materialize.decision"
event = "correct"
target = "materialize.correction"
hint = "Entscheidung an den Materialisierungsagenten (bisherige Sitzung)"

[[transition]]
source = "materialize.decision"
event = "source"
target = "source"
hint = "Entscheidung in einer Planungssitzung festhalten"

# --- implement --------------------------------------------------------

[[transition]]
source = "implement"
event = "done"
target = "implement.review"
hint = "`ki-dev step {bead} --step review` (mit Vorlauf)"

[[transition]]
source = "implement.review"
event = "PASS"
target = "finished"
hint = "Schließen entscheidest du (`bd close {bead}`)"

[[transition]]
source = "implement.review"
event = "fix"
target = "implement.correction"
hint = "Befunde an den Umsetzer (implementer) (bisherige Sitzung)"

[[transition]]
source = "implement.review"
event = "source"
target = "source"
hint = "offene Fragen in einer Planungssitzung klären"

[[transition]]
source = "implement.review"
event = "decision"
target = "implement.decision"
hint = "du entscheidest: accept, correct oder source"

[[transition]]
source = "implement.correction"
event = "done"
target = "implement.review"
hint = "`ki-dev step {bead} --step review --next-turn` (Vorlauf, optional `--feedback-file DATEI|-`)"

[[transition]]
source = "implement.correction"
event = "preflight_failed"
target = "implement.correction"
hint = "Exit 1 von --next-turn: Nachricht an den Umsetzer (implementer)"

[[transition]]
source = "implement.decision"
event = "accept"
target = "finished"
hint = "Entscheidung im Bead festhalten (kein PASS); Schließen entscheidest du"

[[transition]]
source = "implement.decision"
event = "correct"
target = "implement.correction"
hint = "Entscheidung an den Umsetzer (implementer) (bisherige Sitzung)"

[[transition]]
source = "implement.decision"
event = "source"
target = "source"
hint = "Entscheidung in einer Planungssitzung festhalten"

# --- neue Quelle: immer über die bestehende Karte ---------------------

[[transition]]
source = "source"
event = "imported"
target = "map"
hint = "`ki-dev step map --agent AGENT --session SITZUNG --title TITEL`; bestehende Karte ergänzen, keine zweite"
