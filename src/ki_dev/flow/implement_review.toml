# Übergangsbestand bis ki-dev-ablauf-cak.7: dieselbe Datei liegt im
# Ablaufpaket außerhalb des Gerüsts (docs/ablaufpakete.de.md).
# Umsetzung mit Vorlauf (checks) vor jedem Review.
# Übergang bis ki-dev-ablauf-ige.6: wird mit implement.toml ein
# Ablauf (eine Datei, Turns für manual und Agenten).
# Paketablauf auf dem Review-Muster: Zustände und Kanten aus dem
# Muster, gemeinsame Teile aus dem Katalog flow/patterns/review.toml;
# hier stehen nur Parameter. PASS führt nach finished, der Hinweis
# nennt den nächsten Schritt. `ki-dev -f NAME step` führt einen Turn mit dem
# Executor manual aus.

name = "implement_review"
templates = "review"
pattern_catalog = ["ki_dev:review"]
start = "implement"

# Bindung der Maschinenoperation an den Ops-Katalog: `checks` ruft
# den Vorlauf `checks.preflight` (ki_dev.ops.checks); sein Ergebnis ist
# eines der genannten Ereignisse, Tatsachen, Bericht und Befund gehen
# in die Laufdaten. turn und ask sind Übergaben an den Executor ihrer
# Rolle.
[op.checks]
do = "checks.preflight"
input = []
output = { facts = ["facts"], report = ["report"], finding = ["finding"] }
events = ["checks_passed", "checks_partial", "checks_failed"]

[[phase]]
id = "implement"
use = "write_review_preflight"
next = "finished"

[phase.template]
write = "role-implement"
review = "review-implement"
again = "again-implement"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "criteria" },
  { use = "next_steps" },
  { use = "report" },
  { use = "guidelines" }, { use = "attempt" },
]

# Bead-Felder, ohne die eine Übergabe formal unvollständig ist (Exit 2).
[phase.require]
write = ["design", "acceptance_criteria"]
review = ["design", "acceptance_criteria"]

# Laufdaten der Review-Übergabe und ihre Herkunft: Tatsachen und
# Bericht des Vorlaufs (`ki-dev -f implement_review step` nennt sie,
# wenn sie fehlen).
[phase.input]
review = { facts = "preflight", report = "preflight" }

# Rollen der Sitzungen; welcher Executor (Agent, manual, mock) eine
# Rolle bearbeitet, sagt das Profil.
[phase.role]
write = "worker"
review = "review"
correction = "worker"

[phase.actor]
write = "Umsetzer (implementer)"
review = "Review-Agent (nach deterministischem Vorlauf)"
correction = "Umsetzer (implementer, bisherige Sitzung)"

[phase.hint.write]
done = "`ki-dev -f implement_review step {bead} implement implement=ANTWORT.json` (Vorlauf, dann Review)"

[phase.hint.review]
PASS = "Schließen entscheidest du (`bd close {bead}`)"
fix = "Befunde an den Umsetzer (implementer) (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev -f implement_review step {bead} implement.correction implement.correction=ANTWORT.json` (Vorlauf, dann Review)"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS); Schließen entscheidest du"
correct = "Entscheidung an den Umsetzer (implementer) (bisherige Sitzung)"
