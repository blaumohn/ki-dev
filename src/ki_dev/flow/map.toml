# Kartierung: Quelle → Karte (ein Bead je Thema).
# Paketablauf auf dem Review-Muster: Zustände und Kanten aus dem
# Muster, gemeinsame Teile aus dem Katalog flow/patterns/review.toml;
# hier stehen nur Parameter. PASS führt nach finished, der Hinweis
# nennt den nächsten Schritt. `ki-dev -f NAME step` führt einen Turn mit dem
# Executor manual aus.

name = "map"
templates = "review"
pattern_catalog = ["review"]
start = "map"

[[phase]]
id = "map"
use = "write_review"
next = "finished"

[phase.template]
write = "role-map"
review = "review-map"
again = "again-map"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "source_refs" },
  { use = "next_steps" }, { use = "reading_hint" },
  { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "source_refs" },
  { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]

# Bead-Felder, ohne die eine Übergabe formal unvollständig ist (Exit 2).
[phase.require]
write = ["source_refs"]
review = ["source_refs"]

# Rollen der Sitzungen; welcher Executor (Agent, manual, mock) eine
# Rolle bearbeitet, sagt das Profil.
[phase.role]
write = "worker"
review = "review"
correction = "worker"

[phase.actor]
write = "Kartierungsagent"
review = "Review-Agent (Kartenprüfung)"
correction = "Kartierungsagent (bisherige Sitzung)"

[phase.hint.write]
done = "`ki-dev -f map step KARTE map.review` (KARTE = erstellte oder ergänzte Karte)"

[phase.hint.review]
PASS = "`ki-dev -f graph step {bead} graph`"
fix = "Befunde an den Kartierungsagenten (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev -f map step {bead} map.correction map.correction=ANTWORT.json`"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev -f graph step {bead} graph`"
correct = "Entscheidung an den Kartierungsagenten (bisherige Sitzung)"
