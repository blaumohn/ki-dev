# Lieferablauf: ein begrenzter Auftrag von der ersten Beauftragung bis zur
# geprüften Integration.
#
# Die frühere „loop“ ist hier keine eigene Ebene, sondern eine
# Rückkante: controller_step --fix--> worker_step_prepare
# → … → checkpoint --> controller_step. Wann sie endet, entscheiden
# allein die Wächter dieses Ablaufs (Runden- und Versuchsgrenzen), nicht
# der Ausführer.
#
# Lesart einer Kante (UML-Schreibweise):
#   source --event [cond] / actions--> target
# Gleiche (source, event) werden in Dateireihenfolge geprüft; der erste
# passende Wächter gewinnt. Passt keiner, ist das Ereignis dort nicht
# erlaubt. `escalation` hält mit dieser Ursache an; Fortsetzungspunkt
# ist der Quellzustand. `operation` sagt dem Ausführer, was er beim
# Betreten tut. Format: src/ki_dev/flow/model.py.

name = "delivery"
start = "start"
final = ["passed", "error"]
# Review-Antworten des Controllers: PASS oder eine Befundklasse; das
# Urteil folgt aus der Klasse (ein Vokabular für step und run).
priority = ["escalate", "decision", "fix"]

[finding_class.fix]
verdict = "CHANGES"
text = "an ein Abnahmekriterium gebunden, korrigierbar"

[finding_class.decision]
verdict = "NEEDS_DECISION"
text = "nur der Mensch kann entscheiden"

[finding_class.escalate]
verdict = "ESCALATE"
text = "nicht zuverlässig automatisch fortsetzbar"

[vocabulary]
# machine: ki-dev erzeugt das Ereignis selbst; agent: ein Adapter
# liefert die formale Antwort; finalization: Git-Abschlussweg;
# wait: Halt bis zu einer Antwort von außen.
kinds = ["machine", "agent", "finalization", "wait", "final"]
events = [
  "run_started",
  "controller_task", "PASS", "fix", "decision", "escalate",
  "protocol_error",
  "worker_inputs_prepared", "worker_completed", "worker_needs_decision",
  "worker_escalate", "worker_process_error",
  "step_result_captured", "checkpoint_recorded",
  "reviewed_result_frozen", "history_finalized", "final_result_verified",
  "integration_completed", "finalization_error",
  "process_error", "execution_stopped",
  "resume_requested",
]
guards = [
  "checked_result",         # ein Worker-Ergebnis ist gecheckpointet
  "changes_rounds_left",    # changes_round < changes_rounds
  "worker_attempts_left",   # worker_attempt < worker_attempts
  "protocol_attempts_left", # protocol_attempt < protocol_attempts
  "process_retries_left",   # process_retry < process_retries
  "delta_effective",        # Schrittdelta hat beobachtete Wirkung
  "result_ok",              # Abschlussprüfung bzw. Integration gelungen
  "changes_refused",        # Fakt des Ausführers: Korrekturbudget des Laufs erschöpft
  "stagnation",             # Fakt des Ausführers: gleiches Kriterium wiederholt beanstandet
]
actions = [
  "begin_task",             # worker_attempt + 1, changes_round = 0
  "begin_correction",       # worker_attempt + 1, changes_round + 1
  "retry_protocol",         # protocol_attempt + 1
  "retry_process",          # process_retry + 1
  "keep_result",            # gecheckpointetes Ergebnis liegt vor
  "drop_result",            # kein prüfbares Ergebnis mehr
]
escalations = [
  "agent",
  "protocol_attempts_exhausted", "worker_attempts_exhausted",
  "changes_rounds_exhausted", "process_retries_exhausted",
  "empty_result_unresolved", "final_verification_failed",
  "integration_failed", "execution_guard",
]
# Was der Ausführer beim Betreten tut. start, task, prepare und
# checkpoint erzeugt ki-dev selbst; work und review rufen einen
# Adapter; evidence und die Abschlussoperationen sind Git-/bd-Arbeit.
operations = [
  "start", "task", "review", "prepare", "work", "evidence",
  "checkpoint", "freeze", "finalize_history", "verify_final", "integrate",
]

# --- Zustände ---------------------------------------------------------

[[state]]
id = "start"
kind = "machine"
operation = [{ do = "start" }]

[[state]]
id = "controller_step"
kind = "agent"
actor = "Controller (Review-Sitzung)"
# Ohne geprüftes Ergebnis gibt es nichts zu beurteilen: der erste
# Auftrag kommt aus der Laufkonfiguration, nicht von einem Agenten.
operation = [
  { do = "review", cond = ["checked_result"], template = "review" },
  { do = "task" },
]

[[state]]
id = "worker_step_prepare"
kind = "machine"
operation = [{ do = "prepare" }]

[[state]]
id = "worker_step"
kind = "agent"
actor = "Worker (Bau-Sitzung)"
operation = [{ do = "work", template = "work" }]

[[state]]
id = "capture_step_result"
kind = "machine"
operation = [{ do = "evidence" }]

[[state]]
id = "checkpoint"
kind = "machine"
operation = [{ do = "checkpoint" }]

[[state]]
id = "freeze_reviewed_result"
kind = "finalization"
operation = [{ do = "freeze" }]

[[state]]
id = "finalize_history"
kind = "finalization"
operation = [{ do = "finalize_history" }]

[[state]]
id = "verify_final_result"
kind = "finalization"
operation = [{ do = "verify_final" }]

[[state]]
id = "fast_forward_integrate"
kind = "finalization"
operation = [{ do = "integrate" }]

[[state]]
id = "waiting_decision"
kind = "wait"
actor = "Mensch (Entscheider)"

[[state]]
id = "paused_interactive"
kind = "wait"
actor = "Mensch (Entscheider)"

[[state]]
id = "passed"
kind = "final"

[[state]]
id = "error"
kind = "final"

# --- Beauftragung -----------------------------------------------------

[[transition]]
source = "start"
event = "run_started"
actions = ["drop_result"]
target = "controller_step"

[[transition]]
source = "controller_step"
event = "controller_task"
cond = ["!worker_attempts_left"]
escalation = "worker_attempts_exhausted"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "controller_task"
actions = ["begin_task", "drop_result"]
target = "worker_step_prepare"

# --- Rückkante: CHANGES öffnet eine Korrekturrunde --------------------

[[transition]]
source = "controller_step"
event = "fix"
cond = ["checked_result", "changes_refused"]
escalation = "execution_guard"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "fix"
cond = ["checked_result", "stagnation"]
escalation = "execution_guard"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "fix"
cond = ["checked_result", "!changes_rounds_left"]
escalation = "changes_rounds_exhausted"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "fix"
cond = ["checked_result", "!worker_attempts_left"]
escalation = "worker_attempts_exhausted"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "fix"
cond = ["checked_result"]
actions = ["begin_correction", "drop_result"]
target = "worker_step_prepare"

# --- weitere Controller-Urteile ---------------------------------------

[[transition]]
source = "controller_step"
event = "decision"
target = "waiting_decision"

[[transition]]
source = "controller_step"
event = "escalate"
escalation = "agent"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "PASS"
cond = ["checked_result"]
target = "freeze_reviewed_result"

[[transition]]
source = "controller_step"
event = "protocol_error"
cond = ["!protocol_attempts_left"]
escalation = "protocol_attempts_exhausted"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "protocol_error"
actions = ["retry_protocol"]
target = "controller_step"

# --- Worker-Turn ------------------------------------------------------

[[transition]]
source = "worker_step_prepare"
event = "worker_inputs_prepared"
target = "worker_step"

[[transition]]
source = "worker_step"
event = "worker_completed"
target = "capture_step_result"

[[transition]]
source = "worker_step"
event = "worker_needs_decision"
target = "waiting_decision"

[[transition]]
source = "worker_step"
event = "worker_escalate"
escalation = "agent"
target = "paused_interactive"

[[transition]]
source = "worker_step"
event = "worker_process_error"
cond = ["!process_retries_left"]
escalation = "process_retries_exhausted"
target = "paused_interactive"

[[transition]]
source = "worker_step"
event = "worker_process_error"
actions = ["retry_process"]
target = "worker_step_prepare"

[[transition]]
source = "worker_step"
event = "protocol_error"
cond = ["!protocol_attempts_left"]
escalation = "protocol_attempts_exhausted"
target = "paused_interactive"

[[transition]]
source = "worker_step"
event = "protocol_error"
actions = ["retry_protocol"]
target = "worker_step"

# --- Nachweis: nur wirksamer Delta wird geprüft -----------------------

[[transition]]
source = "capture_step_result"
event = "step_result_captured"
cond = ["delta_effective"]
target = "checkpoint"

[[transition]]
source = "capture_step_result"
event = "step_result_captured"
cond = ["!changes_rounds_left"]
escalation = "empty_result_unresolved"
target = "paused_interactive"

[[transition]]
source = "capture_step_result"
event = "step_result_captured"
cond = ["!worker_attempts_left"]
escalation = "worker_attempts_exhausted"
target = "paused_interactive"

[[transition]]
source = "capture_step_result"
event = "step_result_captured"
actions = ["begin_correction", "drop_result"]
target = "worker_step_prepare"

[[transition]]
source = "checkpoint"
event = "checkpoint_recorded"
actions = ["keep_result"]
target = "controller_step"

# --- Abschluss: PASS ist ein Urteil, PASSED erst nach Integration -----

[[transition]]
source = "freeze_reviewed_result"
event = "reviewed_result_frozen"
target = "finalize_history"

[[transition]]
source = "freeze_reviewed_result"
event = "finalization_error"
target = "error"

[[transition]]
source = "finalize_history"
event = "history_finalized"
target = "verify_final_result"

[[transition]]
source = "finalize_history"
event = "finalization_error"
target = "error"

[[transition]]
source = "verify_final_result"
event = "final_result_verified"
cond = ["result_ok"]
target = "fast_forward_integrate"

[[transition]]
source = "verify_final_result"
event = "final_result_verified"
escalation = "final_verification_failed"
target = "paused_interactive"

[[transition]]
source = "verify_final_result"
event = "finalization_error"
target = "error"

[[transition]]
source = "fast_forward_integrate"
event = "integration_completed"
cond = ["result_ok"]
target = "passed"

[[transition]]
source = "fast_forward_integrate"
event = "integration_completed"
escalation = "integration_failed"
target = "paused_interactive"

[[transition]]
source = "fast_forward_integrate"
event = "finalization_error"
target = "error"

# --- technische Fehler und Schutzhalt des Ausführers ------------------

# Eine Maschinenoperation (Vorbereitung, Nachweis, Review-Aufruf)
# scheitert technisch: begrenzt wiederholen, dann anhalten.
[[transition]]
source = ["controller_step", "worker_step_prepare", "capture_step_result"]
event = "process_error"
cond = ["!process_retries_left"]
escalation = "process_retries_exhausted"
target = "paused_interactive"

[[transition]]
source = "controller_step"
event = "process_error"
actions = ["retry_process"]
target = "controller_step"

[[transition]]
source = "worker_step_prepare"
event = "process_error"
actions = ["retry_process"]
target = "worker_step_prepare"

[[transition]]
source = "capture_step_result"
event = "process_error"
actions = ["retry_process"]
target = "capture_step_result"

# Schutzhalt (Kontext-/Kontingentgrenze, fehlgeschlagener
# Agentenaufruf): aus jedem aktiven Zustand anhalten, Fortsetzung dort.
[[transition]]
source = [
  "start", "controller_step", "worker_step_prepare", "worker_step",
  "capture_step_result", "checkpoint", "freeze_reviewed_result",
  "finalize_history", "verify_final_result", "fast_forward_integrate",
]
event = "execution_stopped"
escalation = "execution_guard"
target = "paused_interactive"

# --- Halt und Fortsetzung durch den Menschen --------------------------

[[transition]]
source = "waiting_decision"
event = "resume_requested"
target = "controller_step"

[[transition]]
source = "paused_interactive"
event = "resume_requested"
target = "@history"
