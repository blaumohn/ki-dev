# Übergangsbestand bis ki-dev-ablauf-cak.7: dieselbe Datei liegt im
# Ablaufpaket außerhalb des Gerüsts (docs/ablaufpakete.de.md).
# Materialisierung: Vorgang → umsetzbarer Bead.
# Paketablauf auf dem Review-Muster: Zustände und Kanten aus dem
# Muster, gemeinsame Teile aus dem Katalog flow/patterns/review.toml;
# hier stehen nur Parameter. PASS führt nach finished, der Hinweis
# nennt den nächsten Schritt. `ki-dev -f NAME step` führt einen Turn mit dem
# Executor manual aus.

name = "materialize"
templates = "review"
pattern_catalog = ["ki_dev:review"]
start = "materialize"

[[phase]]
id = "materialize"
use = "write_review"
next = "finished"

[phase.template]
write = "role-materialize"
review = "review-materialize"
again = "again-materialize"

[phase.context]
write = [
  { use = "epic_sections" }, { use = "source_refs" },
  { use = "next_steps" }, { use = "guidelines" }, { use = "attempt" },
]
review = [
  { use = "finding_classes" },
  { use = "epic_sections" },
  { use = "source_refs" },
  { use = "next_steps" },
  { use = "guidelines" }, { use = "attempt" },
]

# Bead-Felder, ohne die eine Übergabe formal unvollständig ist (Exit 2).
[phase.require]
write = ["source_refs"]
review = ["source_refs", "design", "acceptance_criteria"]

# Rollen der Sitzungen; welcher Executor (Agent, manual, mock) eine
# Rolle bearbeitet, sagt das Profil.
[phase.role]
write = "worker"
review = "review"
correction = "worker"

[phase.actor]
write = "Materialisierungsagent"
review = "Review-Agent (Materialisierungsprüfung)"
correction = "Materialisierungsagent (bisherige Sitzung)"

[phase.hint.write]
done = "`ki-dev -f materialize step {bead} materialize.review`"

[phase.hint.review]
PASS = "`ki-dev -f implement_review step {bead} implement`"
fix = "Befunde an den Materialisierungsagenten (bisherige Sitzung)"

[phase.hint.correction]
done = "`ki-dev -f materialize step {bead} materialize.correction materialize.correction=ANTWORT.json`"

[phase.hint.decision]
accept = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev -f implement_review step {bead} implement`"
correct = "Entscheidung an den Materialisierungsagenten (bisherige Sitzung)"
