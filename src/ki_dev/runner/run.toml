# Lauf-Maschine des Ausführers (Gerüst, kein Ablaufpaket): eine
# parallele Statechart (SCXML `<parallel>`) mit drei Regionen. Eine
# Konfiguration ist ein Tupel, z. B. (review, started, running).
#
# - `ablauf`: der `[statechart]` des Pakets; das Gerüst setzt ihn beim
#   Laden ein (src/ki_dev/runner/protocol.py, `compose`). Diese
#   Datei nennt ihn nur über `done.state.ablauf`.
# - `operation`: die offene Operation als Zwei-Schreib-Protokoll.
#   Absicht speichern (`prepared` → `started`), externe Wirkung
#   außerhalb der Maschine ausführen, Ergebnis speichern
#   (`artifact_saved`).
# - `halt`: ob der Lauf fährt. Die Bibliothek koppelt die Regionen: ein
#   Ereignis wirkt in jeder Region, die eine Kante dafür hat. So hält
#   `escalation.<ursache>` aus dem Ablauf hier an (der Ablauf legt die
#   Ursache ab und bleibt stehen), `wait` aus einem wartenden
#   Ablaufzustand ebenso, und das Ende des Ablaufs meldet die
#   Bibliothek als `done.state.ablauf`.
#
# Grenzen: der Adapter misst, `measured` trägt die Messung; der
# Wächter `within_limits` vergleicht sie mit den Grenzwerten des Laufs
# (Regel 4). Eine Überschreitung hält an (`stopped`); `resume` setzt
# am selben Zustand fort.
#
# Fortsetzen ist `resume` (ohne Antwort) oder `answer` (mit Antwort des
# Menschen); was im aktuellen Halt nicht passt, weist die Bibliothek ab.
#
# Format: [statechart] von python-statemachine (src/ki_dev/fsm.py); die
# Namen in `cond`/`on`/`enter` sind Methoden von RunModel
# (src/ki_dev/runner/protocol.py).

[statechart]
name = "run"

[statechart.states.lauf]
initial = true
parallel = true

# --- Region operation -------------------------------------------------

# Eine Operation beginnt und scheitert nur, solange der Lauf fährt
# (`is_running`). Fehlschlag: der Ablauf entscheidet, wie es weitergeht.
# `internal`: nur die Region wechselt; eine externe Kante verließe den
# parallelen Elternzustand und setzte alle Regionen zurück (SCXML).
[[statechart.states.lauf.states.operation.transitions]]
event = "failed"
cond = "is_running"
target = "idle"
internal = true

[statechart.states.lauf.states.operation.states.idle]
initial = true
enter = "drop_operation"

[[statechart.states.lauf.states.operation.states.idle.transitions]]
event = "hold"
cond = "is_running"
target = "prepared"
on = "hold_operation"

[[statechart.states.lauf.states.operation.states.prepared.transitions]]
event = "start"
cond = "is_running"
target = "started"
on = "begin_operation"

[[statechart.states.lauf.states.operation.states.prepared.transitions]]
event = "artifact_saved"
target = "idle"

# Messung vor der Wirkung: die Region bleibt, der Halt entscheidet.
[[statechart.states.lauf.states.operation.states.prepared.transitions]]
event = "measured"

[statechart.states.lauf.states.operation.states.started]
transitions = [
  { event = "artifact_saved", target = "idle" },
  # Bote ohne Antwort: die Operation läuft nach der Antwort erneut
  { event = "answer_pending", target = "prepared" },
  # Wirkung begonnen, Ergebnis fehlt: bleibt begonnen (halt entscheidet)
  { event = "interrupted" },
  # Ausnahme des Executors, Verbrauch ist verbucht: Halt mit Grund
  { event = "turn_failed", target = "idle" },
]

# --- Region halt ------------------------------------------------------

[statechart.states.lauf.states.halt.states.running]
initial = true
transitions = [
  # nach Prozessende dort weiter, wo der Datensatz steht
  { event = "resume" },
  { event = "measured", unless = "within_limits", target = "stopped", on = "note_stop" },
  { event = "escalation", target = "paused_interactive" },
  { event = "wait", target = "waiting" },
  { event = "answer_pending", target = "awaiting_input" },
  { event = "interrupted", unless = "repeatable", target = "uncertain" },
  { event = "turn_failed", target = "stopped", on = "note_failure" },
  { event = "done.state.ablauf", target = "finished" },
]

# Bote ohne Antwort: Halt des Ausführers, nicht des Ablaufs.
[statechart.states.lauf.states.halt.states.awaiting_input]
transitions = [{ event = "resume", target = "running" }]

# Schutzhalt: eine Grenze ist erreicht (Grund: `halt_reason`).
[statechart.states.lauf.states.halt.states.stopped]
transitions = [{ event = "resume", target = "running" }]

# Bis der Mensch das Ergebnis abgleicht (`--reconcile-result`).
[statechart.states.lauf.states.halt.states.uncertain]
transitions = [{ event = "reconcile", target = "running" }]

[statechart.states.lauf.states.halt.states.paused_interactive]
transitions = [{ event = "answer", target = "running" }]

# Der Ablauf wartet auf eine Antwort von außen (welche, sagt sein
# Zustand, z. B. `waiting_decision`).
[statechart.states.lauf.states.halt.states.waiting]
transitions = [{ event = "answer", target = "running" }]

[statechart.states.lauf.states.halt.states.finished]
final = true
