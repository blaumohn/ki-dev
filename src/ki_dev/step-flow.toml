# Zustandstabelle für `ki-dev step`: Daten, kein Code.
#
# Jede Phase (map, graph, materialize, build) hat eigene Zustände:
#   P             Schreibsitzung (erstellt oder ergänzt das Ergebnis)
#   P.review      getrennte Review-Sitzung
#   P.korrektur   Schreibagent behebt Befunde der Klasse fix
#   P.entscheidung  der Mensch entscheidet
# Gemeinsam: quelle (offene Frage braucht eine neue Quelle) und fertig.
#
# Ein Review endet mit PASS oder mit der stärksten Befundklasse nach
# `vorrang`; das Urteil (CHANGES/NEEDS_DECISION) folgt aus der Klasse.
# `befehl` ist ein Hinweis für den Menschen; {bead} setzt ki-dev ein.
# Nichts davon läuft automatisch. Geprüft von src/ki_dev/step_flow.py.

start = "map"
ende = "fertig"
vorrang = ["entscheidung", "quelle", "fix"]

[befundklasse.fix]
urteil = "CHANGES"
text = "aus vorhandenen Quellen korrigierbar"

[befundklasse.quelle]
urteil = "NEEDS_DECISION"
text = "offene Frage, braucht eine neue Quelle"

[befundklasse.entscheidung]
urteil = "NEEDS_DECISION"
text = "nur der Mensch kann entscheiden"

# --- Zustände ---------------------------------------------------------

[[zustand]]
id = "map"
art = "schreiben"
wer = "Kartierungsagent"

[[zustand]]
id = "map.review"
art = "review"
wer = "Review-Agent (Kartenprüfung)"

[[zustand]]
id = "map.korrektur"
art = "korrektur"
wer = "Kartierungsagent (bisherige Sitzung)"

[[zustand]]
id = "map.entscheidung"
art = "entscheidung"
wer = "Mensch"

[[zustand]]
id = "graph"
art = "schreiben"
wer = "Auflösungsagent"

[[zustand]]
id = "graph.review"
art = "review"
wer = "Review-Agent (Graphprüfung)"

[[zustand]]
id = "graph.korrektur"
art = "korrektur"
wer = "Auflösungsagent (bisherige Sitzung)"

[[zustand]]
id = "graph.entscheidung"
art = "entscheidung"
wer = "Mensch"

[[zustand]]
id = "materialize"
art = "schreiben"
wer = "Materialisierungsagent"

[[zustand]]
id = "materialize.review"
art = "review"
wer = "Review-Agent (Materialisierungsprüfung)"

[[zustand]]
id = "materialize.korrektur"
art = "korrektur"
wer = "Materialisierungsagent (bisherige Sitzung)"

[[zustand]]
id = "materialize.entscheidung"
art = "entscheidung"
wer = "Mensch"

[[zustand]]
id = "build"
art = "schreiben"
wer = "Bau-Agent"

[[zustand]]
id = "build.review"
art = "review"
wer = "Review-Agent (nach deterministischem Vorlauf)"

[[zustand]]
id = "build.korrektur"
art = "korrektur"
wer = "Bau-Agent (bisherige Sitzung)"

[[zustand]]
id = "build.entscheidung"
art = "entscheidung"
wer = "Mensch"

[[zustand]]
id = "quelle"
art = "quelle"
wer = "Mensch (Planungssitzung)"

[[zustand]]
id = "fertig"
art = "ende"
wer = "Mensch"

# --- map --------------------------------------------------------------

[[uebergang]]
von = "map"
bei = "erledigt"
nach = "map.review"
befehl = "`ki-dev step KARTE --step review --review-of map` (KARTE = erstellte oder ergänzte Karte)"

[[uebergang]]
von = "map.review"
bei = "PASS"
nach = "graph"
befehl = "`ki-dev step {bead} --step graph`"

[[uebergang]]
von = "map.review"
bei = "fix"
nach = "map.korrektur"
befehl = "Befunde an den Kartierungsagenten (bisherige Sitzung)"

[[uebergang]]
von = "map.review"
bei = "quelle"
nach = "quelle"
befehl = "offene Fragen in einer Planungssitzung klären"

[[uebergang]]
von = "map.review"
bei = "entscheidung"
nach = "map.entscheidung"
befehl = "du entscheidest: annehmen, korrigieren oder quelle"

[[uebergang]]
von = "map.korrektur"
bei = "erledigt"
nach = "map.review"
befehl = "`ki-dev step {bead} --step review --review-of map --next-turn`"

[[uebergang]]
von = "map.entscheidung"
bei = "annehmen"
nach = "graph"
befehl = "Entscheidung im Bead festhalten (kein PASS), dann `ki-dev step {bead} --step graph`"

[[uebergang]]
von = "map.entscheidung"
bei = "korrigieren"
nach = "map.korrektur"
befehl = "Entscheidung an den Kartierungsagenten (bisherige Sitzung)"

[[uebergang]]
von = "map.entscheidung"
bei = "quelle"
nach = "quelle"
befehl = "Entscheidung in einer Planungssitzung festhalten"

