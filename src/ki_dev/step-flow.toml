bei = "quelle"
nach = "quelle"
befehl = "Entscheidung in einer Planungssitzung festhalten"

# --- neue Quelle: immer über die bestehende Karte ---------------------

[[uebergang]]
von = "quelle"
bei = "importiert"
nach = "map"
befehl = "`ki-dev step map --agent AGENT --session SITZUNG`; bestehende Karte ergänzen, keine zweite"
