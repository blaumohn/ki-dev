# --- build ------------------------------------------------------------

[[uebergang]]
von = "build"
bei = "erledigt"
nach = "build.review"
befehl = "`ki-dev step {bead} --step review` (mit Vorlauf)"

[[uebergang]]
von = "build.review"
bei = "PASS"
nach = "fertig"
befehl = "Schließen entscheidest du (`bd close {bead}`)"

[[uebergang]]
von = "build.review"
bei = "fix"
nach = "build.korrektur"
befehl = "Befunde an den Bau-Agenten (bisherige Sitzung)"

[[uebergang]]
von = "build.review"
bei = "quelle"
nach = "quelle"
befehl = "offene Fragen in einer Planungssitzung klären"

[[uebergang]]
von = "build.review"
bei = "entscheidung"
nach = "build.entscheidung"
befehl = "du entscheidest: annehmen, korrigieren oder quelle"

[[uebergang]]
von = "build.korrektur"
bei = "erledigt"
nach = "build.review"
befehl = "`ki-dev step {bead} --step review --next-turn` (Vorlauf, optional `--feedback-file DATEI|-`)"

[[uebergang]]
von = "build.korrektur"
bei = "vorlauf_rot"
nach = "build.korrektur"
befehl = "Exit 1 von --next-turn: Nachricht an den Bau-Agenten"

[[uebergang]]
von = "build.entscheidung"
bei = "annehmen"
nach = "fertig"
befehl = "Entscheidung im Bead festhalten (kein PASS); Schließen entscheidest du"

[[uebergang]]
von = "build.entscheidung"
bei = "korrigieren"
nach = "build.korrektur"
befehl = "Entscheidung an den Bau-Agenten (bisherige Sitzung)"

[[uebergang]]
