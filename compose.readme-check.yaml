# Wegwerf-Container für make readme-check (tests/readme/user-flow.sh).
# Nur lesbares Dateisystem und Repo.
# /tmp: pro Lauf unter .local/var/readme-check (Projektordner).
# TMPDIR=/tool-tmp: Docker-Volume auf der VM-Platte, nicht im Shared Folder.
# Projektlokale Download-/Build-Caches bleiben erhalten. Kein Docker-Socket.
services:
  check:
    image: ki-dev-readme-check:local
    build:
      context: docker/readme-check
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?}
        GO_VERSION: ${GO_VERSION:?}
        GO_SHA256_AMD64: ${GO_SHA256_AMD64:?}
        GO_SHA256_ARM64: ${GO_SHA256_ARM64:?}
    # Host-UID: Repo-Dateien dürfen nur für den Eigentümer lesbar sein.
    user: ${READMECHECK_USER:?}
    read_only: true
    volumes:
      - .:/repo:ro
      # Anonymes Volume: mit run --rm entfernt; Rechte kommen aus dem Image.
      - type: volume
        target: /tool-tmp
      - type: bind
        source: ${READMECHECK_TMP_DIR:?}
        target: /tmp
        bind:
          create_host_path: false
      - type: bind
        source: ${READMECHECK_CACHE_DIR:?}
        target: /cache
        bind:
          create_host_path: false
    environment:
      TMPDIR: /tool-tmp
      # Große Go-Build-Zwischendateien bleiben auf der Platte.
      GOTMPDIR: /tmp
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      GOPATH: /tmp/go
      GOMODCACHE: /cache/go-mod
      GOCACHE: /cache/go-build
      PIP_CACHE_DIR: /cache/pip
      READMECHECK_WORK_BASE: /tmp/work
      # /repo gehört dem Host-Nutzer, nicht dem Container-Nutzer.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    command: ["bash", "/repo/tests/readme/user-flow.sh"]
