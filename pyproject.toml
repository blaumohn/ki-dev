[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ki-dev"
version = "0.0.1"
description = "Begrenzte deterministische Agentenmaschine fuer ki-dev loop"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "plumbum>=1.8",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "hypothesis>=6.100",
]

[project.scripts]
ki-dev = "ki_dev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ki_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: echter Docker-Lauf; braucht Daemon, Image ki-dev-agent:local und CLI-Anmeldungen",
]
