[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ki-dev"
version = "0.0.1"
description = "Deklarative Abläufe für Agentensitzungen: Ablauf, Ausführer, Adapter"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "plumbum>=1.8",
  "python-statemachine[validation]==3.2.1",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "filelock>=4.0,<5",
  "persist-queue>=1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.16,<0.17",
]

[project.scripts]
ki-dev = "ki_dev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ki_dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: echter Docker-Lauf; braucht Daemon, Image ki-dev-agent:local und CLI-Anmeldungen",
]

[tool.ki-dev.handoff]
base_max_chars = 4000
feedback_max_chars = 600

[tool.ki-dev.handoff.preflight]
corrections = []

[[tool.ki-dev.handoff.preflight.checks]]
name = "tests"
argv = ["./.venv/bin/pytest"]
timeout_s = 360

[[tool.ki-dev.handoff.preflight.checks]]
name = "lint"
argv = ["./.venv/bin/ruff", "check", "."]
timeout_s = 60

